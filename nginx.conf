
server {

    listen       80;
    server_tokens off;

    # special url for external healthchecks (monitoring systems, AWS Route 53 healthchecks, ALB etc)
    location = /health {
        types {}
        default_type text/plain;
        return 200 "OK";
    }

    location /icons/ {
       alias /mnt/data/icons/;
       expires -1;
       autoindex on;
       autoindex_format json;
       add_header Access-Control-Allow-Origin *;
       # try to prevent any evil SVGs
       add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox";
    }

    location / {
       alias /mnt/data/;
       expires -1;
       autoindex on;
       autoindex_format json;
       default_type text/json;
       add_header Access-Control-Allow-Origin *;
    }

}
